name: goThoomMacro Full Multi‑OS Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro .

      - name: Build .deb package
        run: |
          mkdir -p pkg/DEBIAN
          echo "Package: gothoommacro
Version: ${GITHUB_REF#refs/tags/}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Maxtraxv3
Description: goThoomMacro macro tool" > pkg/DEBIAN/control

          mkdir -p pkg/usr/local/bin
          cp dist/goThoomMacro pkg/usr/local/bin/

          dpkg-deb --build pkg dist/goThoomMacro.deb

      - name: Build AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y appimagetool

          mkdir -p appimage/usr/bin
          cp dist/goThoomMacro appimage/usr/bin/

          appimagetool appimage dist/goThoomMacro.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro .

      - name: Build DMG
        run: |
          brew install create-dmg
          mkdir dmg
          cp dist/goThoomMacro dmg/
          create-dmg dist/goThoomMacro.dmg dmg/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
