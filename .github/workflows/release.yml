name: goThoomMacro Full Multi‑OS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro .

      - name: Build .deb package
        run: |
          mkdir -p pkg/DEBIAN
          echo "Package: gothoommacro
Version: ${{ github.ref_name }}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Maxtraxv3
Description: goThoomMacro macro tool" > pkg/DEBIAN/control

          mkdir -p pkg/usr/local/bin
          cp dist/goThoomMacro pkg/usr/local/bin/

          dpkg-deb --build pkg dist/goThoomMacro.deb

      - name: Build AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y appimagetool

          mkdir -p appimage/usr/bin
          cp dist/goThoomMacro appimage/usr/bin/

          echo '#!/bin/sh
          exec "$APPDIR/usr/bin/goThoomMacro"' > appimage/AppRun
          chmod +x appimage/AppRun

          echo "[Desktop Entry]
          Type=Application
          Name=goThoomMacro
          Exec=goThoomMacro
          Icon=goThoomMacro" > appimage/goThoomMacro.desktop

          appimagetool appimage dist/goThoomMacro.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro

      - name: Create macOS .app bundle
        run: |
          VERSION="${{ github.ref_name }}"

          mkdir -p goThoomMacro.app/Contents/MacOS
          mkdir -p goThoomMacro.app/Contents/Resources

          cp dist/goThoomMacro goThoomMacro.app/Contents/MacOS/

          cat > goThoomMacro.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>goThoomMacro</string>
              <key>CFBundleDisplayName</key>
              <string>goThoomMacro</string>
              <key>CFBundleIdentifier</key>
              <string>com.maxtraxv3.gothoommacro</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>goThoomMacro</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          mv goThoomMacro.app dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
