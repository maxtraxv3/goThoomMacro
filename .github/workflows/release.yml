name: goThoomMacro Full Multi-OS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro .

      - name: Build .deb package
        run: |
          # Strip 'v' from version tag, fallback to 1.0.0 if not running on a tag
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: gothoommacro
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Maxtraxv3
          Description: goThoomMacro macro tool
          EOF

          mkdir -p pkg/usr/local/bin
          cp dist/goThoomMacro pkg/usr/local/bin/

          dpkg-deb --build pkg dist/goThoomMacro.deb

      - name: Build AppImage
        run: |
          mkdir -p appimage/usr/bin
          cp dist/goThoomMacro appimage/usr/bin/

          cat << 'EOF' > appimage/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/goThoomMacro" "$@"
          EOF
          chmod +x appimage/AppRun

          cat << 'EOF' > appimage/goThoomMacro.desktop
          [Desktop Entry]
          Type=Application
          Name=goThoomMacro
          Exec=goThoomMacro
          Icon=goThoomMacro
          Categories=Utility;
          EOF

          # appimagetool requires an icon to exist to build successfully
          touch appimage/goThoomMacro.png

          # Download official appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # Extract and run requires FUSE, GitHub actions requires this env var
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool appimage dist/goThoomMacro.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/goThoomMacro

      - name: Create macOS .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          mkdir -p dist/goThoomMacro.app/Contents/MacOS
          mkdir -p dist/goThoomMacro.app/Contents/Resources

          cp dist/goThoomMacro dist/goThoomMacro.app/Contents/MacOS/

          cat <<EOF > dist/goThoomMacro.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>goThoomMacro</string>
              <key>CFBundleDisplayName</key>
              <string>goThoomMacro</string>
              <key>CFBundleIdentifier</key>
              <string>com.maxtraxv3.gothoommacro</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>goThoomMacro</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # GitHub Releases cannot upload raw directories (.app). Zip it.
          cd dist
          zip -r goThoomMacro-macOS.zip goThoomMacro.app
          rm -rf goThoomMacro.app # Remove unzipped version so it doesn't fail the release step

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
